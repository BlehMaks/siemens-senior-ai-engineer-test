[project]
name = "siemens-agent-api"
version = "0.1.0"
description = "Tenant-isolated asynchronous API for the research agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.116,<1",
    "google-cloud-firestore>=2.29,<3",
    "google-cloud-tasks>=2.24,<3",
    "siemens-search-agent==0.1.0",
    "uvicorn>=0.35,<1",
]

[project.scripts]
agent-api-key-admin = "agent_api.security.key_admin:main"

[tool.uv.sources]
siemens-search-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_api"
