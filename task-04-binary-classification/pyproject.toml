[project]
name = "siemens-binary-classification"
version = "0.1.0"
description = "Leakage-aware binary classification study"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.3,<4",
    "scikit-learn>=1.7,<2",
]

[dependency-groups]
dev = ["pandas-stubs>=2.3,<4"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "binary_classification"
