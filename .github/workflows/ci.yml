name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.6
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked workspace
        run: uv sync --frozen --all-packages --dev

      - name: Run every blocking application gate
        run: make check

  terraform:
    name: Terraform contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: /tmp/terraform-plugin-cache
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format, initialize, and validate every root
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=task-03-deployment-strategy/terraform fmt -check -recursive
          for directory in \
            bootstrap \
            modules/identity \
            modules/managed_services \
            modules/model_plane \
            modules/ingress_policy \
            modules/run_services \
            environments/dev \
            environments/production-model-plane
          do
            terraform -chdir="task-03-deployment-strategy/terraform/$directory" init -backend=false
            terraform -chdir="task-03-deployment-strategy/terraform/$directory" validate
          done

      - name: Run Terraform resource contracts
        run: |
          for directory in bootstrap modules/identity modules/managed_services modules/model_plane modules/ingress_policy modules/run_services environments/dev environments/production-model-plane
          do
            terraform -chdir="task-03-deployment-strategy/terraform/$directory" test
          done

  container:
    name: Container, vulnerability scan, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the Cloud Run architecture
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: task-03-deployment-strategy/container/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: siemens-agent-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reject high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: siemens-agent-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Generate the reviewed SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: siemens-agent-api:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Preserve the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 7
