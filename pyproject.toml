[tool.uv.workspace]
members = ["task-*"]

[dependency-groups]
dev = [
    "hypothesis>=6.136,<7",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests", "task-*/tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = [
    "task-01-search-agent/src",
    "task-02-agent-api/src",
    "task-03-deployment-strategy/src",
    "task-04-binary-classification/src",
    "task-05-material-similarity/src",
    "task-06-category-consolidation/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

